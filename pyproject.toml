[project]
name = "qbee-gpio"
version = "4.3.1"
description = "Control a display and amplifier relay for use in an AirPlay and/or Spotify Connect Raspberry Pi server."
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [
    { name = "Gabriel Pajot", email = "gab@lescactus.eu" },
]
urls = { repository = "https://github.com/gpajot/qbee-gpio" }
dependencies = [
    "aiomqtt ==2.5.1 ; python_version < '4'",
    "asyncinotify ==4.4.4",
    "concurrent-tasks ==1.18.0",
    "gpiozero==2.0.1.post3",
    "pydantic-settings[yaml]==2.16.1",
]
license-files = ["LICENSE"]

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.17.0",
    "ruff==0.17.1",
    "ty==0.0.90",
]

[project.scripts]
qbee-gpio = "qbee_gpio.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "PT", "RUF", "UP"]
ignore = ["E501", "RUF001"]
per-file-ignores = { "__init__.py" = ["F401"] }

[tool.uv]
build-backend = { module-name = "qbee_gpio", module-root = "" }

[tool.ty.rules]
unused-ignore-comment = "warn"

[tool.ty.terminal]
error-on-warning = true
[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"
